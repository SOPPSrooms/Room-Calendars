name: Fetch Room Calendars

on:
  schedule:
    # Every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Fetch ICS feeds
        env:
          ICS_URL_R225:  ${{ secrets.ICS_URL_R225 }}
          ICS_URL_R226:  ${{ secrets.ICS_URL_R226 }}
          ICS_URL_R226X: ${{ secrets.ICS_URL_R226X }}
        run: node scripts/fetch-calendars.mjs

      - name: Commit updated calendar data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Sync room calendars [skip ci]"
          git push
